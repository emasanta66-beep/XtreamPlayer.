name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 8.14.3
          cache-provider: basic

      # Si el repositorio tiene el secret KEYSTORE_BASE64, firma con esa clave
      # (así el APK se instala encima de la versión anterior). Si no es válido, usa debug.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/xtream.jks" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/xtream.jks" ] && keytool -list -keystore "$RUNNER_TEMP/xtream.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "KEYSTORE_PATH=$RUNNER_TEMP/xtream.jks" >> "$GITHUB_ENV"
              echo "Se usará la firma de release."
            else
              echo "::warning::KEYSTORE_BASE64 no es un keystore válido; se compilará en debug."
            fi
          else
            echo "No hay KEYSTORE_BASE64; se compilará en debug."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon -PbuildNumber="$BUILD_NUMBER"
            cp app/build/outputs/apk/release/app-release.apk XtreamPlayer.apk
          else
            gradle assembleDebug --no-daemon -PbuildNumber="$BUILD_NUMBER"
            cp app/build/outputs/apk/debug/app-debug.apk XtreamPlayer.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XtreamPlayer-apk
          path: XtreamPlayer.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: XtreamPlayer-apk
          path: .

      - name: Generar attestación del APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: XtreamPlayer.apk

      # Solo este trabajo necesita permisos para publicar y atestiguar el Release.
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if gh release view "v$BUILD_NUMBER" >/dev/null 2>&1; then
            gh release upload "v$BUILD_NUMBER" XtreamPlayer.apk --clobber
          else
            gh release create "v$BUILD_NUMBER" XtreamPlayer.apk \
              --title "XtreamPlayer v$BUILD_NUMBER" \
              --notes "Compilación automática $BUILD_NUMBER" \
              --latest
          fi
