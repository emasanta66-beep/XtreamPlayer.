name: Preview APK

on:
  push:
    branches: [codex/visual-refresh]

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 8.14.3
          cache-provider: basic

      - name: Preparar firma de la aplicación
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/xtream.jks" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/xtream.jks" ] && keytool -list -keystore "$RUNNER_TEMP/xtream.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "KEYSTORE_PATH=$RUNNER_TEMP/xtream.jks" >> "$GITHUB_ENV"
              echo "Se usará la firma configurada."
            else
              echo "::warning::La clave de firma no es válida; se generará una APK de prueba."
            fi
          else
            echo "No hay clave configurada; se generará una APK de prueba."
          fi

      - name: Compilar APK de vista previa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BUILD_NUMBER=$(date +%s)
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon -PbuildNumber="$BUILD_NUMBER"
            cp app/build/outputs/apk/release/app-release.apk XtreamPlayer-preview.apk
          else
            gradle assembleDebug --no-daemon -PbuildNumber="$BUILD_NUMBER"
            cp app/build/outputs/apk/debug/app-debug.apk XtreamPlayer-preview.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XtreamPlayer-preview-apk
          path: XtreamPlayer-preview.apk
          retention-days: 14
